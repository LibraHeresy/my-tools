name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "PDF 工具台 v__VERSION__"
          releaseBody: |
            本版本包含 PDF 拆分、精灵图切图、合成图集和图片转 PNG 工具。

            离线运行，不上传文件。

            自动更新会从本 Release 的 latest.json 获取新版本。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis,msi

      - name: Ensure updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS setup.exe not found" }

          $sigPath = "$($setup.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "NSIS signature not found" }
          $signature = (Get-Content $sigPath -Raw).Trim()

          $release = gh release view $tag --json assets,body | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -like "*-setup.exe" } | Select-Object -First 1
          if (-not $asset) { throw "NSIS release asset not found" }

          $repo = "${{ github.repository }}"
          $url = "https://github.com/$repo/releases/download/$tag/$($asset.name)"
          $manifest = [ordered]@{
            version = $version
            notes = $release.body
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64-nsis" = [ordered]@{
                signature = $signature
                url = $url
              }
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $url
              }
            }
          }

          $manifest | ConvertTo-Json -Depth 6 | Set-Content "latest.json" -Encoding utf8
          gh release upload $tag latest.json --clobber
