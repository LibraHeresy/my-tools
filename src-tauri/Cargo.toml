[package]
name = "pdf-workbench"
version = "0.8.0"
description = "A lightweight, local-first PDF workbench"
authors = ["my-tools"]
edition = "2024"

[lib]
name = "pdf_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
slicer-io = { path = "crates/slicer-io" }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
